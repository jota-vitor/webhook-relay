x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://relay:relay@db:5432/relay
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: python -m app.worker
    environment: *app-env
    depends_on:
      api: { condition: service_started }
    deploy:
      replicas: 2

  receiver:
    build: .
    command: uvicorn examples.receiver:app --host 0.0.0.0 --port 9000
    environment:
      FAILURE_RATE: "0.3"
    ports:
      - "9000:9000"

volumes:
  pgdata:
